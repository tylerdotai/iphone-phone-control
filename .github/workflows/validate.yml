name: Validate documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fixed commands only: no event-text interpolation or phone access.
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; verified official tag
        with:
          persist-credentials: false
      - name: Check syntax and public documentation
        run: make lint
      - name: Exercise real repository and rejected mutations
        if: always()
        run: make test
      - name: Emit durable JSON receipt in job log
        if: always()
        run: |
          python3 -c 'from pathlib import Path; p=Path(".artifacts/e2e.json"); print(p.read_text() if p.exists() else "E2E receipt not produced; check earlier failure")'
